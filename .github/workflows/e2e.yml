name: E2E Integration Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  e2e-deploy:
    name: K8s E2E Deploy & Rollout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image for Kind
        uses: docker/build-push-action@v5
        with:
          context: ./api
          load: true
          tags: local-api:test
          cache-from: type=gha

      - name: Build Web image for Kind
        uses: docker/build-push-action@v5
        with:
          context: ./web
          load: true
          tags: local-web:test
          cache-from: type=gha

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.9.0

      - name: Load images into Kind
        run: |
          kind load docker-image local-api:test --name chart-testing
          kind load docker-image local-web:test --name chart-testing

      - name: Create Namespace
        run: kubectl create namespace avatars-generator

      - name: Setup Dummy Secret
        run: cp k8s/overlays/local/.env.secret.example k8s/overlays/local/.env.secret

      - name: Kustomize and Deploy (Non-persistent)
        run: |
          # Copiamos la carpeta k8s entera al tmp para no ensuciar el git repo actual
          cp -r k8s /tmp/k8s-deploy
          cd /tmp/k8s-deploy/overlays/local
          
          # Override dinámico sobre la copia
          kustomize edit set image ghcr.io/mati2173/cf-avatars-generator-api=local-api:test
          kustomize edit set image ghcr.io/mati2173/cf-avatars-generator-web=local-web:test
          
          # Deploy real al cluster Kind
          kubectl apply -k .

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/avatars-generator-api -n avatars-generator --timeout=120s
          kubectl rollout status deployment/avatars-generator-web -n avatars-generator --timeout=120s
