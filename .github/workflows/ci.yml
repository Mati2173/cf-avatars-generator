name: Continuous Integration

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run Backend Tests
        run: make test-backend

      - name: Run Frontend Tests
        run: make test-frontend

  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cf-avatars-generator-api
          tags: |
            type=edge,branch=develop
            type=sha,format=short,prefix=sha-

      - name: Build API image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: ./api
          load: true
          tags: local-api:test
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Build and Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (tags, labels) for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cf-avatars-generator-web
          tags: |
            type=edge,branch=develop
            type=sha,format=short,prefix=sha-

      - name: Build Web image for Trivy scan
        uses: docker/build-push-action@v5
        with:
          context: ./web
          load: true
          tags: local-web:test
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner on Web
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-web:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Build and Push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  k8s-manifest-validation:
    name: K8s Manifest Correctness (Dry-Run)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create k8s Kind Cluster (API Server validation)
        uses: helm/kind-action@v1.9.0

      - name: Create Namespace
        run: kubectl create namespace avatars-generator

      - name: Setup Dummy Secret
        run: cp k8s/overlays/local/.env.secret.example k8s/overlays/local/.env.secret

      - name: Validate Manifests (Syntax)
        run: kubectl kustomize k8s/overlays/local/ > /dev/null

      - name: Validate Manifests against K8s API (Dry-Run Server)
        run: kubectl apply -k k8s/overlays/local/ --dry-run=server
