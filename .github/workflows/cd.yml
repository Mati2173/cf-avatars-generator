name: Continuous Deployment (CD)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  id-token: write   # REQUERIDO para OIDC
  contents: read    # REQUERIDO para checkout
  packages: write   # REQUERIDO para empujar a GHCR

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::466798854716:role/github-actions-staging-role
  EKS_CLUSTER_NAME: staging-cluster
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push-deploy:
    name: Build, Push & Deploy to EKS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build and Push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web
          tags: |
            type=sha,format=short,prefix=sha-

      - name: Build and Push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Update Kustomize Manifests with new Image SHA
        working-directory: k8s/overlays/staging
        run: |
          # Extraemos el tag (ej: sha-1234567)
          API_TAG=$(echo "${{ steps.meta-api.outputs.tags }}" | head -n 1 | cut -d ':' -f 2)
          WEB_TAG=$(echo "${{ steps.meta-web.outputs.tags }}" | head -n 1 | cut -d ':' -f 2)
          
          # Inyectamos el tag recién creado en Kustomize
          kustomize edit set image ghcr.io/${{ env.IMAGE_NAME }}-api=ghcr.io/${{ env.IMAGE_NAME }}-api:$API_TAG
          kustomize edit set image ghcr.io/${{ env.IMAGE_NAME }}-web=ghcr.io/${{ env.IMAGE_NAME }}-web:$WEB_TAG
          
          # Mostramos el diff por logs para auditoría
          cat kustomization.yaml

      - name: Deploy to K8s via Kustomize
        run: |
          kubectl apply -k k8s/overlays/staging
