# Load testing con k6
#   docker compose -f docker-compose.k6.yml run --rm k6-quick
#   docker compose -f docker-compose.k6.yml run --rm k6-full

name: avatars-generator-k6

services:
  k6-quick:
    image: grafana/k6:0.57.0
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/reports:/reports
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    command: run /scripts/quick.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "avatars-generator.local:host-gateway"

  k6-full:
    image: grafana/k6:0.57.0
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./loadtest:/scripts:ro
      - ./loadtest/reports:/reports
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:8080}
    command: run /scripts/script.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "avatars-generator.local:host-gateway"
